<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKK Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        /* ── Background slideshow ── */
        #slideshow {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .slide {
            position: absolute;
            inset: 0;
            background-size: 130%;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .slide.active {
            opacity: 1;
            animation: pan 8s ease-in-out forwards;
        }

        @keyframes pan {
            0%   { background-size: 130%; background-position: 30% 40%; }
            100% { background-size: 140%; background-position: 60% 55%; }
        }

        /* 50% transparent white overlay */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 248, 240, 0.5);
            z-index: 1;
        }

        /* ── Card ── */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 20px;
            box-shadow: 0 4px 32px rgba(150, 80, 40, 0.18);
            padding: 52px 48px;
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        .divider {
            width: 48px;
            height: 3px;
            background-color: #C0522A;
            border-radius: 2px;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            color: #3B1A0A;
            letter-spacing: 0.12em;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1rem;
            color: #8A6650;
            font-weight: 600;
            margin-bottom: 36px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .download-btn {
            display: inline-block;
            background-color: #C0522A;
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            padding: 14px 36px;
            border-radius: 50px;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .download-btn:hover {
            background-color: #A04020;
            transform: translateY(-2px);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 32px;
            font-size: 0.78rem;
            color: #BCA898;
        }
    </style>
</head>
<body>

    <div id="slideshow"></div>
    <div id="overlay"></div>

    <div class="card">
        <h1>Hong Kong Kitchen</h1>
        <div class="divider"></div>
        <p class="tagline">View our latest menu</p>
        <a class="download-btn" href="HKK-menu-113025.pdf" download>Download Menu (PDF)</a>
        <p class="footer">Opens as a PDF download</p>
    </div>

    <script>
        const images = [
            'notion_photos/image.jpeg',
            'notion_photos/image 1.jpeg',
            'notion_photos/image 2.jpeg',
            'notion_photos/image 3.jpeg',
            'notion_photos/image 4.jpeg',
            'notion_photos/image 5.jpeg',
            'notion_photos/image 6.jpeg',
            'notion_photos/image 7.jpeg',
            'notion_photos/image 8.jpeg',
            'notion_photos/image 9.jpeg',
            'notion_photos/image 10.jpeg',
            'notion_photos/image 11.jpeg',
            'notion_photos/image 12.jpeg',
            'notion_photos/image 13.jpeg',
            'notion_photos/image 14.jpeg',
            'notion_photos/image 15.jpeg',
            'notion_photos/image 16.jpeg',
            'notion_photos/image 17.jpeg',
            'notion_photos/image 18.jpeg',
            'notion_photos/image 19.jpeg',
        ];

        const container = document.getElementById('slideshow');
        let current = 0;

        // Pre-create two slide elements for cross-fading
        const slides = [document.createElement('div'), document.createElement('div')];
        slides.forEach(s => { s.className = 'slide'; container.appendChild(s); });

        let activeIdx = 0;

        function showSlide(imgIndex) {
            const next = 1 - activeIdx;
            slides[next].style.backgroundImage = `url('${images[imgIndex]}')`;

            // Force reflow so animation restarts
            slides[next].classList.remove('active');
            void slides[next].offsetWidth;
            slides[next].classList.add('active');

            slides[activeIdx].classList.remove('active');
            activeIdx = next;
        }

        showSlide(current);

        setInterval(() => {
            current = (current + 1) % images.length;
            showSlide(current);
        }, 6000);
    </script>
</body>
</html>
